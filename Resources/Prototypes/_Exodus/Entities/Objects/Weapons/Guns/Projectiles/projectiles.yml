- type: entity
  name: laser mode
  id: BulletPurpleLaser
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser_greyscale
      shader: unshaded
      color: purple
  - type: Projectile
    impactEffect: BulletImpactEffectPurpleLaser
    damage:
      types:
        Heat: 25
  - type: Ammo
    muzzleFlash: null
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Reflective
    reflective:
    - Energy

- type: entity
  name: assault rifle mode
  id: BulletLaserGaudaAssaultRifle
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Ammo
    muzzleFlash: null
  - type: Sprite
    color: "#31c2e2"
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: heavylaser
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectBlueGauda
    damage:
      types:
        Heat: 15
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: PointLight
    radius: 2
    color: "#ec800c"
    energy: 0.5
  - type: ChangeTemperatureOnCollide
    heat: 500

- type: entity
  name: assault rifle mode
  id: BulletLaserGaudaSniperRifle
  parent: BulletLaserGaudaAssaultRifle
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectBlueGauda
    damage:
      types:
        Heat: 75
  - type: StaminaDamageOnCollide
    damage: 100
  - type: StunOnCollide
    stunAmount: 3
    knockdownAmount: 3

- type: entity
  name: wide laser barrage
  id: BulletLaserGaudaShotgun
  categories: [ HideSpawnMenu ]
  parent: BulletLaserGaudaAssaultRifle
  components:
  - type: ProjectileSpread
    proto: BulletLaserGaudaAssaultRifle
    count: 5
    spread: 10
