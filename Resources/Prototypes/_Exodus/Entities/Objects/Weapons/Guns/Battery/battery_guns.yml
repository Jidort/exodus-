- type: entity
  name: advanced pulse pistol
  parent: BaseWeaponBatterySmall
  id: WeaponAdvancedPulsePistol
  description: Energy pistol of new generation specifically designed for Blueshield Departament.
  components:
  - type: Sprite
    sprite: Exodus/Objects/Weapons/Guns/Battery/pulse_pistol_advanced.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Exodus/Objects/Weapons/Guns/Battery/pulse_pistol_advanced.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: BulletPurpleLaser
    fireCost: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
  - type: Appearance
  - type: Tag
    tags:
    - Sidearm
  - type: StaticPrice
    price: 750
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletPurpleLaser
      fireCost: 100
    - proto: BulletTaser
      fireCost: 100

- type: entity
  name: Gauda
  parent: WeaponLaserCarbine
  id: WeaponLaserSniperGauda
  description: Облегченная версия стандартной лазерной винтовки. Имеет более низкий расход заряда для стрельбы.
  components:
  - type: Sprite
    sprite: Exodus/Objects/Weapons/Guns/Battery/sniper_lasergun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    size: Large
    shape:
    - 0,0,3,1
  - type: ItemToggleSize
    activatedSize: Huge
  - type: SpeedModifiedOnWield
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: ComponentToggler
    components:
    - type: Gun
      selectedMode: SemiAuto
      fireRate: 0.4
      availableModes:
      - SemiAuto
      soundGunshot:
        path: /Audio/Exodus/Weapons/Guns/Gunshots/sniper_laser.ogg
    - type: ProjectileBatteryAmmoProvider
      proto: BulletPurpleLaser
      fireCost: 1500
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
    autoRechargePause: true
    autoRechargePauseTime: 15
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: BulletPurpleLaser
    fireCost: 100
