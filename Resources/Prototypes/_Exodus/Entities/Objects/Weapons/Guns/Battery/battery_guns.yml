- type: entity
  name: advanced pulse pistol
  parent: BaseWeaponBatterySmall
  id: WeaponAdvancedPulsePistol
  description: Energy pistol of new generation specifically designed for Blueshield Departament.
  components:
  - type: Sprite
    sprite: Exodus/Objects/Weapons/Guns/Battery/pulse_pistol_advanced.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Exodus/Objects/Weapons/Guns/Battery/pulse_pistol_advanced.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: BulletPurpleLaser
    fireCost: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
  - type: Appearance
  - type: Tag
    tags:
    - Sidearm
  - type: StaticPrice
    price: 750
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletPurpleLaser
      fireCost: 100
    - proto: BulletTaser
      fireCost: 100

- type: entity
  name: Gauda
  parent: [BaseWeaponBattery, BaseCentcommCommandContraband, BaseGunWieldable]
  id: WeaponLaserSniperGauda
  description: Облегченная версия стандартной лазерной винтовки. Имеет более низкий расход заряда для стрельбы.
  components:
  - type: Sprite
    sprite: Exodus/Objects/Weapons/Guns/Battery/sniper_lasergun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: Item
    size: Large
    sprite: Exodus/Objects/Weapons/Guns/Battery/sniper_lasergun.rsi
    shape:
    - 0,0,3,1
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.9
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
    autoRechargePause: true
    autoRechargePauseTime: 15
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletLaserGaudaAssaultRifle
      fireCost: 25
    - proto: BulletLaserGaudaShotgun
      fireCost: 500
    - proto: BulletLaserGaudaSniperRifle
      fireCost: 1500
  - type: ProjectileBatteryAmmoProvider
    proto: BulletLaserGaudaAssaultRifle
    fireCost: 25
  - type: Gun
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
