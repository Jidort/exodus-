- type: entity
  name: emergency combat medipen
  parent: [ChemicalMedipen, BaseCentcommCommandContraband]
  id: CombatMedipenDS
  description: An emergency medipen that gets you back on your feet in the shortest possible time, even with the most severe injuries. Due to the high cost and difficulty of production, it is used by death squad only.
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Saliforsom
          Quantity: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: icon_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 15
    injectOnly: true
  - type: Sprite
    sprite: Exodus/Objects/Specific/Medical/auto_injector.rsi
    netsync: false
    layers:
    - state: icon
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#9defee"
      - state: base-colorB-inhand-left
        color: "#42464b"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#9defee"
      - state: base-colorB-inhand-right
        color: "#42464b"

- type: entity
  name: P.A.N.A.C.E.A.
  parent: [BaseItem, BaseCentcommCommandContraband]
  description:
  id: HyposprayDS
  components:
  - type: Sprite
    sprite: Exodus/Objects/Specific/Medical/auto_injector.rsi
    state: icon
  - type: Item
    sprite: Exodus/Objects/Specific/Medical/auto_injector.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 2.5
  - type: StaticPrice
    price: 550
  - type: SolutionRegeneration
    solution: hypospray
    generated:
      reagents:
      - ReagentId: Saliforsom
        Quantity: 0.25
